<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b39">
  <meta name="description" content="__HOME_DESCRIPTION__">
  <meta property="og:title" content="__HOME_OG_TITLE__">
  <meta property="og:description" content="__HOME_OG_DESCRIPTION__">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__HOME_OG_IMAGE__">
  <meta property="og:url" content="__HOME_OG_URL__">
  <meta name="twitter:card" content="summary_large_image">
  <title>__HOME_TITLE__</title>
  <link rel="canonical" href="__HOME_CANONICAL__">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/v7.css">
</head>
<body>
  <header class="site-header v7-header">
    <a href="/" class="brand v7-brand" aria-label="RIHAM Home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-words"><b>RIHAM STORE</b><small>শালীন পোশাকের বিশ্বস্ত ঠিকানা</small></span>
    </a>
    <a href="#lookbook" class="header-order"><span aria-hidden="true">⌄</span> পণ্য দেখুন</a>
  </header>

  <main>
    <section id="lookbook" class="lookbook home-product-list" aria-label="RIHAM পণ্যসমূহ">
      <div class="lookbook-loading">কালেকশন লোড হচ্ছে…</div>
    </section>

    <section class="reviews-section" id="reviewsSection" hidden aria-label="গ্রাহকদের মতামত">
      <p class="eyebrow">CUSTOMER REVIEWS</p>
      <h2>গ্রাহকদের মতামত</h2>
      <div class="review-slider">
        <button type="button" class="review-arrow review-prev" id="reviewPrev" aria-label="আগের রিভিউ">‹</button>
        <div class="review-track" id="reviewTrack" tabindex="0"></div>
        <button type="button" class="review-arrow review-next" id="reviewNext" aria-label="পরের রিভিউ">›</button>
      </div>
      <div class="review-dots" id="reviewDots"></div>
    </section>

    <section class="v7-contact">
      <p class="eyebrow">আমরা পাশে আছি</p>
      <h2>সাইজ বা অর্ডার নিয়ে প্রশ্ন আছে?</h2>
      <p>WhatsApp-এ আমাদের সঙ্গে কথা বলুন।</p>
      <a id="contactWhatsapp" href="#" target="_blank" rel="noopener">WhatsApp-এ যোগাযোগ করুন</a>
    </section>
  </main>

  __SHARED_FOOTER__

  </a>
  <div id="toast" class="v7-toast" role="status" aria-live="polite"></div>
  <script src="/static/pixel.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
