services:
  - type: web
    name: riham-store
    runtime: python
    buildCommand: pip install -r requirements-production.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: STORE_NAME
        value: RIHAM
      - key: STORE_THEME
        value: white
      - key: DHAKA_DELIVERY_FEE
        value: "50"
      - key: OUTSIDE_DELIVERY_FEE
        value: "100"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: STEADFAST_API_KEY
        sync: false
      - key: STEADFAST_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
